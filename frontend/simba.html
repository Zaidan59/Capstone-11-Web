<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMBA - Transparansi Program MBG</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
  <link href="/src/output.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body, html, * {
      font-family: 'Public Sans', sans-serif !important;
    }
  </style>
</head>
<body class="bg-gray-50">
  <!-- Header -->
  <header>
    <!-- Navbar -->
    <nav class="flex items-center justify-between px-8 py-4 bg-white shadow">
      <div class="flex items-center space-x-4">
        <img src="simba.png" alt="SIMBA Logo" class="w-12 h-12"> <!-- Ganti dengan logo asli -->
        <span class="font-bold text-2xl">SIMBA</span>
      </div>
      <div class="flex items-center space-x-8">
        <a href="#" class="text-[#232B36] font-medium text-lg">Home</a>
        <a href="#" class="text-[#232B36] font-medium text-lg">Maps</a>
        <a href="#" class="text-[#232B36] font-medium text-lg">Articles</a>
        <img src="Vertical Divider.png" alt="divider" className="h-8 w-px mx-2" />
        <a href="#" class="text-[#232B36] font-medium text-lg hover:text-blue-700 transition">Login</a>
        <button class="bg-[#1673FF] text-white px-5 py-2 rounded-lg font-medium text-lg ml-2 shadow-md hover:bg-blue-700 transition">Sign Up</button>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <!-- Hero Section -->
    <section class="flex flex-col md:flex-row items-center justify-between px-4 md:px-8 py-10 md:py-20 max-w-7xlz mx-auto">
      <!-- Left Container -->
      <div class="w-full md:w-1/2 space-y-4 md:space-y-6">
        <span class="inline-block bg-blue-100 text-blue-700 text-xs md:text-xs font-bold px-3 md:px-4 py-1 md:py-2 rounded-full">🔵 PROGRAM NASIONAL 2024</span>
        <h1 class="text-2xl md:text-2xl lg:text-[60px] font-extrabold leading-tight">
          Transparansi<br>
          Program <span class="text-blue-700">Makan<br>Bergizi Gratis</span><br>
          Untuk Semua
        </h1>
        <p class="text-gray-600 text-sm md:text-lg mt-4 md:mt-6">
          Platform layanan untuk monitoring menu sekolah dan operasional <br> dapur Satuan Pelayanan Pemenuhan Gizi (SPPG) secara real-time <br> untuk memastikan kualitas nutrisi anak bangsa yang optimal.
        </p>
        <div class="flex flex-col md:flex-row space-y-4 md:space-y-0 md:space-x-6 mt-6 md:mt-8">
          <button class="bg-blue-600 text-white px-5 py-2 rounded-lg font-semibold text-sm transition flex items-center gap-2 hover:shadow-[0_8px_40px_0_rgba(22,96,255,0.84)]">Lihat Peta Dapur MBG <span class="ml-1"><img src="Icon.png" alt="icon maps"></span></button>
          <button class="bg-white border border-gray-300 text-gray-700 px-5 py-2 rounded-lg font-semibold text-sm transition hover:shadow-[0_8px_40px_0_rgba(22,96,255,0.84)]">Pelajari Lebih Lanjut</button>
        </div>
      </div>
      <!-- Right Container -->
      <div class="w-full md:w-1/2 flex justify-center mt-6 md:mt-0">
        <img src="hero-image.png" alt="Dapur MBG" class="rounded-lg border-4 border-blue-100 shadow-lg w-full md:w-603px h-auto md:h-339px object-cover">
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    
  </footer>
</body>
</html>
